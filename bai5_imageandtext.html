<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Bai 05 - Image and Text Demonstration</title>
</head>
<body style="text-align: center;">
    <h1>IMAGES</h1>
    <!--Left-->
    <section>
        <figure>
            <img src="images/park.jpg" align="left" alt="Beautiful Park" width="180">
            <p>
                A paragraph with an image. The align attribute of the image is set to "left".
                The image will float to the left of this text
            </p>
        </figure>
    </section>
    <!--right-->
    <section>
        <figure>
            <img src="images/park.jpg" align="right" alt="Beautiful Park" width="180">
            <p>
                A paragraph with an image. The align attribute of the image is set to "right".
                The image will float to the right of this text
            </p>
        </figure>
    </section>
</body>
</html>
